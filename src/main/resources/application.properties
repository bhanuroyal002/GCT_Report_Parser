# Large certification report uploads
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:1GB}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:120000}

# PostgreSQL persistence
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gct_parser}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gct_parser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gct_parser}
spring.datasource.driver-class-name=org.postgresql.Driver

# The application owns the schema for this internal tool.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
